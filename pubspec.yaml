publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  speech_to_text: ^7.4.0
  html: ^0.15.6
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  url_launcher: ^6.3.2

dev_dependencies:
